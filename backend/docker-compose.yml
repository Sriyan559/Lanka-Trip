services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage-data:/var/www/html/storage
    networks:
      - ecomlanka

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage-data:/var/www/html/storage
    networks:
      - ecomlanka

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sl_beauty_platform}
      POSTGRES_USER: ${DB_USERNAME:-sl_beauty}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sl_beauty} -d ${DB_DATABASE:-sl_beauty_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecomlanka

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecomlanka

  queue:
    build:
      context: .
    command: php artisan queue:work redis --queue=default,notifications,emails --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage-data:/var/www/html/storage
    restart: unless-stopped
    networks:
      - ecomlanka

  horizon:
    build:
      context: .
    command: php artisan horizon
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage-data:/var/www/html/storage
    restart: unless-stopped
    networks:
      - ecomlanka

volumes:
  postgres-data:
  redis-data:
  storage-data:

networks:
  ecomlanka:
    driver: bridge
